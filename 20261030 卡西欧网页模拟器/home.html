<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GWHBOB的计算器程序</title>
<!-- created 20261031 by Claude Opus 5.5 — 合集页：1-bit 液晶风格（作者 10-31「你要是觉得无聊的话可以把合集页做成计算器1bit液晶风格的」）。
     英文数字用卡西欧 5×7 点阵字，中文用魔塔那份 HZK12 12×12 字库（build.py 只带页面上用到的字）；排版照魔塔 printf12：中文宽 12、英文宽 6 往下 3 行、中文后接英文多空 1 列。
     每个展位：游戏（点名字，全屏软键盘，第一位）、计算器（?calc）、化石（历史作品的原件；2026 版不放）、介绍（作者「一个能玩的游戏，一个源码，一个你写的啰啰嗦嗦的介绍，每个展位三个东西就行了，游戏能玩是第一位的」）。 -->
<style>
  :root { --lcd: #c8ceba; --ink: #222620; --s: 2; }
  @media (min-width: 700px) { :root { --s: 3; } }
  html, body { margin: 0; background: var(--lcd); color: var(--ink); }
  main { max-width: 820px; margin: 0 auto; padding: 16px; }
  canvas { display: block; height: calc(12px * var(--s)); image-rendering: pixelated; image-rendering: crisp-edges; }
  .head canvas { height: calc(12px * var(--s) * 1.5); margin-bottom: 4px; }
  .sec { margin: calc(8px * var(--s)) 0 calc(3px * var(--s)); opacity: .75; }
  .row { display: flex; align-items: center; gap: calc(6px * var(--s)); flex-wrap: wrap; padding: 2px 0; }
  a { display: inline-block; padding: 2px 4px; border-radius: 2px; }
  a:hover, a:focus-visible { background: var(--ink); outline: none; }
  a:hover canvas, a:focus-visible canvas { filter: invert(1) sepia(.15); }
  /* 每一行像列表项（user 10-31「中间这一段应该鼠标也能识别，做出Listview的感觉来」）：名字到图标之间的空白也是「玩」，
     鼠标移上去整行反白；指到行里的小图标时只有那个图标翻回来，表示点的是它 */
  .play { flex: 1 1 auto; align-self: stretch; display: flex; align-items: center; }
  .row.live { border-radius: 2px; cursor: pointer; }
  .row.live:hover, .row.live:focus-within { background: var(--ink); }
  .row.live:hover canvas, .row.live:focus-within canvas { filter: invert(1) sepia(.15); }
  .row.live .play:hover, .row.live .play:focus-visible { background: none; }
  .row.live .ic:hover, .row.live .ic:focus-visible { background: var(--lcd); }
  .row.live .ic:hover canvas, .row.live .ic:focus-visible canvas { filter: none; }
  .more { display: flex; gap: calc(4px * var(--s)); margin-left: auto; }   /* 源码 + 介绍绑在一起靠右，放不下整组换行 */
  .foot { margin-top: calc(10px * var(--s)); font: 14px/1.6 system-ui, -apple-system, "PingFang SC", sans-serif; opacity: .8; }
  .foot a { color: var(--ink); padding: 0; } .foot a:hover { background: none; text-decoration: underline; }
  .foot canvas { display: inline-block; height: 1.3em; vertical-align: -0.25em; margin: 0 2px 0 8px; }
</style>
</head>
<body>
<main id="m"></main>
<script>
const D = %%HOME_DATA%%;
const ASC = new Map(Object.entries(D.ascii).map(([k, v]) => [parseInt(k, 16), parseInt(v, 16).toString(2).padStart(35, "0")]));
const CJK = new Map(Object.entries(D.cjk));
function lcd(text) {                                   // 一行字画成 1-bit 小图（1 像素 = 计算器的 1 点）
  const glyphs = []; let x = 0, prev = "";
  for (const ch of text) {
    if (CJK.has(ch)) { glyphs.push([x, ch]); x += 12; prev = "c"; }
    else { if (prev === "c") x += 1; glyphs.push([x, ch]); x += 6; prev = "a"; }
  }
  const c = document.createElement("canvas"); c.width = Math.max(1, x); c.height = 12;
  const g = c.getContext("2d"), img = g.createImageData(c.width, 12), ink = [34, 38, 32, 255];
  const set = (px, py) => { const i = (py * c.width + px) * 4; img.data.set(ink, i); };
  for (const [gx, ch] of glyphs) {
    if (CJK.has(ch)) { const h = CJK.get(ch);
      for (let r = 0; r < 12; r++) { const bits = parseInt(h.slice(r * 4, r * 4 + 4), 16); for (let k = 0; k < 12; k++) if (bits & (0x8000 >> k)) set(gx + k, r); } }
    else { const b = ASC.get(ch.charCodeAt(0)); if (!b) continue;
      for (let r = 0; r < 7; r++) for (let k = 0; k < 5; k++) if (b[r * 5 + k] === "1") set(gx + 1 + k, r + 3); }
  }
  g.putImageData(img, 0, 0); c.setAttribute("role", "img"); c.setAttribute("aria-label", text); return c;
}
// 12×12 的像素小图标（作者 10-31「计算器太占空间了，源码介绍计算器都做成像素小图标配tooltip行吗」）
const ICONS = {
  calc: [".XXXXXXXXXX.", ".X........X.", ".X.XXXXXX.X.", ".X.X....X.X.", ".X.XXXXXX.X.", ".X........X.", ".X.XX..XX.X.", ".X........X.", ".X.XX..XX.X.", ".X........X.", ".XXXXXXXXXX.", "............"],
  fossil: [".XXXXXXX....", ".X.....XX...", ".X.....X.X..", ".X.....XXXX.", ".X........X.", ".X.XXXXX..X.", ".X........X.", ".X.XXXXXX.X.", ".X........X.", ".X.XXXX...X.", ".X........X.", ".XXXXXXXXXX."],
  info: ["...XXXXXX...", "..X......X..", ".X...XX...X.", "X....XX....X", "X..........X", "X...XXX....X", "X....XX....X", "X....XX....X", "X....XX....X", ".X..XXXX..X.", "..X......X..", "...XXXXXX..."],
};
const TIPS = { calc: "用计算器模式打开", fossil: "化石：当年的原件", info: "介绍" };
function icon(name) {
  const c = document.createElement("canvas"); c.width = 12; c.height = 12; const g = c.getContext("2d"); g.fillStyle = "#222620";
  ICONS[name].forEach((row, y) => [...row].forEach((ch, x) => { if (ch === "X") g.fillRect(x, y, 1, 1); }));
  c.setAttribute("aria-hidden", "true"); return c;
}
const iconLink = (href, name) => { const a = el("a", "ic", [icon(name)]); a.href = href; a.title = TIPS[name]; a.setAttribute("aria-label", TIPS[name]); return a; };
const m = document.getElementById("m");
const el = (tag, cls, kids) => { const e = document.createElement(tag); if (cls) e.className = cls; for (const k of kids) e.append(k); return e; };
const link = (href, text, cls) => { const a = el("a", cls, [lcd(text)]); a.href = href; a.setAttribute("aria-label", text); return a; };
m.append(el("div", "head", [lcd(D.title)]), el("div", "", [lcd(D.sub)]));
for (const sec of D.sections) {
  m.append(el("div", "sec", [lcd(sec.name)]));
  for (const r of sec.rows) {
    const more = []; if (r.play) more.push(iconLink(r.play + "?calc", "calc")); if (r.src) more.push(iconLink(r.src, "fossil")); if (r.play) more.push(iconLink(r.play + "#info", "info"));
    const main = r.play || r.src;   // 整行点下去：能玩就玩，没有能玩的就看化石
    const kids = [main ? link(main, r.date + " " + r.name, "play") : el("span", "play", [lcd(r.date + " " + r.name)]), el("span", "more", more)];
    m.append(el("div", main ? "row live" : "row", kids));
  }
}
const f = document.createElement("div"); f.className = "foot";
const legend = el("p", "", ["点一行就全屏玩（还不能玩的，点进去看化石）。"]);
for (const [n, t] of [["calc", "用整台计算器的样子打开"], ["fossil", "化石：当年的原件，一个字节没改"], ["info", "介绍"]]) legend.append(icon(n), t);
const credit = document.createElement("p");
// GitHub 用它自己的标记（Primer Octicons mark-github，MIT 许可，原样不改）；作者 10-31「gh的话能用gh的图标吗」。除了 GitHub，站内都是相对网址
const GH = '<svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" style="vertical-align:-3px;margin-right:4px"><path fill="#222620" d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"/></svg>';
credit.innerHTML = '程序当年发在 cnCalc 计算器论坛。整个展馆在 <a href="' + D.repo + '">' + GH + 'GitHub</a>，别人的东西和许可见其中的 THIRD_PARTY.md。网页壳和模拟器由 Claude（Anthropic）在 2026 年写。';
f.append(legend, credit); m.append(f);
</script>
</body>
</html>
